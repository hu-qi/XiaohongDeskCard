<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XiaohongDeskCard · 240×240 模拟器</title>
<style>
:root {font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#253345;background:#eef1f5}
*{box-sizing:border-box}
main{max-width:980px;margin:42px auto;padding:0 18px}
h1{margin:0 0 4px;font-size:25px} p{color:#5d6a7b;line-height:1.6}
small{color:#7d8694}.layout{display:grid;grid-template-columns:minmax(290px,1fr) minmax(280px,1fr);gap:24px;margin-top:28px}
.panel{background:#fff;border:1px solid #e0e5ed;border-radius:16px;padding:24px;box-shadow:0 3px 14px #18264010}
label{font-size:13px;font-weight:600;display:block;margin:13px 0 6px}
input,select,button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid #cfd6e1;width:100%;background:#fff}
button{background:#2055a3;border-color:#2055a3;color:#fff;cursor:pointer;margin-top:18px;font-weight:600}
button:disabled{background:#9ba8ba;border-color:#9ba8ba}
.display{margin:8px auto;width:240px;height:240px;background:#f9faf8;border:8px solid #27313f;border-radius:12px;display:flex;flex-direction:column;overflow:hidden;color:#182436;box-shadow:0 12px 24px #18264025}
.brand{padding:12px 8px;background:#ba2639;color:#fff;text-align:center;font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.display-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 10px;text-align:center}
.person{font-size:32px;font-weight:760;max-width:100%;overflow-wrap:anywhere;line-height:1.3}
.title{font-size:13px;color:#5b6270;max-width:100%;overflow-wrap:anywhere;margin-top:10px}
.foot{text-align:center;color:#b92535;font-size:9px;letter-spacing:1px;padding:6px}
.status{margin-top:16px;background:#f3f6fc;border-radius:8px;padding:12px;font:12px/1.6 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.legend{text-align:center;font-size:12px;color:#7d8590;margin-top:12px}
.notice{background:#fff7e5;border:1px solid #efdbb1;border-radius:9px;padding:10px 13px;font-size:13px}
@media(max-width:700px){.layout{grid-template-columns:1fr}main{margin:18px auto}.panel{padding:18px}}
</style>
</head>
<body>
<main>
<h1>小鸿智能桌牌 · 软件模拟器</h1>
<p>复用 C99 Desk Core 的桌面验证环境。预览尺寸为 240×240，供后续适配小鸿 AI 原装屏。</p>
<div class="notice">开发验证模式：<strong>BLE / SLE 是本机模拟的分片协议</strong>，并未打开真实蓝牙或星闪无线连接；Wi-Fi 为本机 HTTP。</div>
<div class="layout">
<section class="panel">
<h2>设备显示预览</h2>
<div class="display" role="img" aria-label="桌牌屏幕模拟">
<div class="brand" id="orgPreview">OpenHarmony 社区</div>
<div class="display-body"><div class="person" id="namePreview">张三</div><div class="title" id="titlePreview">技术负责人</div></div>
<div class="foot">XIAOHONG DESK</div>
</div>
<div class="legend">原装 TFT 预览 · 240 × 240 px</div>
<div class="status" id="status">正在读取设备状态…</div>
</section>
<section class="panel">
<h2>模拟终端控制</h2>
<form id="editor">
<label for="name">姓名</label><input id="name" maxlength="32" value="张三" required>
<label for="title">职位</label><input id="title" maxlength="48" value="技术负责人">
<label for="organization">组织</label><input id="organization" maxlength="70" value="OpenHarmony 社区">
<label for="theme">模板</label>
<select id="theme"><option value="classic">经典红</option><option value="modern">现代黑</option><option value="minimal">极简白</option></select>
<label for="transport">传输方式（模拟）</label>
<select id="transport"><option value="sle">星闪 SLE · 分片模拟</option><option value="ble">BLE · 分片模拟</option><option value="wifi">Wi-Fi · HTTP</option></select>
<label for="token">本地开发令牌</label><input id="token" type="password" value="dev-only-token" autocomplete="off">
<button id="submit" type="submit">下发桌牌内容</button>
</form>
<button id="refresh" type="button" style="background:#fff;color:#2055a3">刷新模拟屏幕</button>
<p><small>模板/字号仅是 Web 模拟样式，LVGL 实屏排版仍需独立适配与测试。</small></p>
</section>
</div>
</main>
<script>
const $ = id => document.getElementById(id);
let revision = 0;
let requestId = Math.floor(Math.random() * 10000000) + 1;
const fields = ['name', 'title', 'organization', 'theme'];
function themePreview(theme) {
  const brand = $('orgPreview');
  brand.style.background = theme === 'modern' ? '#26313e' : theme === 'minimal' ? '#fbfbfb' : '#ba2639';
  brand.style.color = theme === 'minimal' ? '#ba2639' : '#ffffff';
}
function display(data) {
  const c = data.display;
  $('orgPreview').textContent = c.organization || 'XiaohongDesk';
  $('namePreview').textContent = c.name;
  $('titlePreview').textContent = c.title;
  themePreview(c.theme);
  revision = data.revision;
}
async function refresh() {
  try {
    const response = await fetch('/api/v1/desk/status');
    if (!response.ok) throw Error('状态请求失败');
    const data = await response.json();
    display(data);
    $('status').textContent = '设备：'+data.device+'\nRevision：'+data.revision+'\n通信：仅软件模拟（未连接实机）';
  } catch(e) { $('status').textContent = String(e); }
}
$('refresh').onclick = refresh;
$('editor').onsubmit = async event => {
  event.preventDefault();
  $('submit').disabled = true;
  const transport = $('transport').value;
  const content = Object.fromEntries(fields.map(key => [key, $(key).value]));
  const endpoint = transport === 'wifi' ? '/api/v1/desk/content' : '/sim/'+transport+'/write';
  try {
    const response = await fetch(endpoint,{
      method:transport === 'wifi'?'PUT':'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+$('token').value},
      body:JSON.stringify({requestId:requestId++,expectedRevision:revision,content})
    });
    const result=await response.json();
    if(result.state)display(result.state);
    $('status').textContent='通信：'+transport.toUpperCase()+'（模拟）\n结果：'+(result.result||result.error)+'\nRevision：'+revision;
    if(!response.ok) $('status').textContent+='\n'+(result.detail||'更新未成功');
  } catch(e) { $('status').textContent=String(e); }
  finally { $('submit').disabled=false; }
};
refresh();
</script>
</body>
</html>
